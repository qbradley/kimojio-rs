[workspace]

members = [
    "kimojio",
    "kimojio-fsm-http",
    "kimojio-json",
    "kimojio-macros",
    "kimojio-tls",
    "perf",
    "examples",
]

resolver = "3"

[workspace.package]
version = "0.17.0"
edition = "2024"
license = "MIT"
homepage = "https://github.com/Azure/kimojio-rs"
repository = "https://github.com/Azure/kimojio-rs"
readme = "README.md"

[workspace.dependencies]
criterion = { version = "0.8", default-features = false }
foreign-types-shared = "0.1"
futures = "0.3"
hpack = "0.3"
http = "1"
httparse = "1"
impls = "1"
intrusive-collections = "0.10"
kimojio = { path = "kimojio", version = "0.17.0" }
kimojio-fsm-http = { path = "kimojio-fsm-http", version = "0.17.0-alpha.1", default-features = false }
kimojio-json = { path = "kimojio-json", version = "0.17.0" }
kimojio-macros = { path = "kimojio-macros", version = "0.17.0" }
kimojio-tls = { path = "kimojio-tls", version = "0.17.0" }
libc = "0.2"
openssl = "0.10"
openssl-sys = "0.9"
pin-project-lite = "0.2"
roaring = "0.11"
rustix = { version = "1", features = [
    "event",
    "io_uring",
    "mount",
    "fs",
    "mm",
    "process",
    "rand",
    "system",
    "time",
    "thread",
] }
rustix-uring = { version = "0.6" }
scopeguard = "1"
sha2 = "0.10"
static_assertions = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zerocopy = { version = "0.8", features = ["derive"] }

# from macros
quote = "1"
syn = { version = "2", features = ["full"] }

# for examples
anyhow = "1"
clap = { version = "4", features = ["derive"] }
