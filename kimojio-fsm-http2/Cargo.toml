[package]
name = "kimojio-fsm-http2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Synchronous sans-I/O HTTP/2 protocol engine"

[dependencies]
kimojio-fsm-http1.workspace = true
rustc-hash = "2"

[features]
hpack-test-support = []

[dev-dependencies]
criterion.workspace = true
rustix = { version = "1", features = ["event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bench]]
name = "engine"
harness = false
