[package]
name = "kimojio-http1"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Conventional async HTTP/1 over the standalone Kimojio HTTP/1 state machine"

[dependencies]
futures.workspace = true
http = "1"
kimojio = { path = "../kimojio", version = "0.17.0", default-features = false }
kimojio-fsm-http1 = { path = "../kimojio-fsm-http1" }

[features]
virtual-clock = ["kimojio/virtual-clock"]
metrics = ["kimojio-fsm-http1/metrics"]
diagnostics = ["kimojio-fsm-http1/diagnostics"]

[dev-dependencies]
base64 = "0.22"
rustix.workspace = true
serde_json = "1"
