[package]
name = "kimojio-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Kept out of the parent workspace so the sanitizer and nightly flags the fuzz
# profile needs never leak into an ordinary build of the runtime.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"

[dependencies.kimojio]
path = "../kimojio"
default-features = false
features = ["fuzzing"]

[dependencies.kimojio-fsm-http]
path = "../kimojio-fsm-http"

[dependencies.kimojio-json]
path = "../kimojio-json"

[profile.release]
debug = true

[[bin]]
name = "json_tokenizer"
path = "fuzz_targets/json_tokenizer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "varlink_reply"
path = "fuzz_targets/varlink_reply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hpack_decode"
path = "fuzz_targets/hpack_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hpack_round_trip"
path = "fuzz_targets/hpack_round_trip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h2_server_accept"
path = "fuzz_targets/h2_server_accept.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http1_connection"
path = "fuzz_targets/http1_connection.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http1_chunked"
path = "fuzz_targets/http1_chunked.rs"
test = false
doc = false
bench = false
